[project]
name = "mbsd-examples"
version = "0.8.0"
description = "Runnable examples and gallery assets for MBSD Core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mbsd>=0.8,<0.9",
    "matplotlib>=3.8,<4.0",
    "numpy>=2.0,<3.0",
]
license = { file = "LICENSE" }
authors = [
    { name = "Julius Alcocer" },
]
keywords = [
    "multibody dynamics",
    "mechanism examples",
    "kinematics",
    "dynamics",
    "gallery",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[project.urls]
Homepage = "https://multibodysystemsdynamics.com"
Repository = "https://github.com/JAlcocerT/mbsd-examples"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbsd_examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.uv.sources]
mbsd = { path = "../mbsd-core" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
