name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mbsd-examples
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: mbsd-examples

      - name: Checkout MBSD Core release pair
        uses: actions/checkout@v4
        with:
          repository: JAlcocerT/mbsd-core
          ref: v0.8.0
          path: mbsd-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run checks
        run: make check

      - name: Build distributions
        run: |
          uv build
          uv --directory ../mbsd-core build

      - name: Smoke test built wheels
        run: |
          uv venv "$RUNNER_TEMP/mbsd-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/mbsd-wheel-smoke/bin/python" ../mbsd-core/dist/mbsd-*.whl
          uv pip install --python "$RUNNER_TEMP/mbsd-wheel-smoke/bin/python" --no-deps dist/mbsd_examples-*.whl
          "$RUNNER_TEMP/mbsd-wheel-smoke/bin/python" -c "import mbsd, mbsd_examples; print(mbsd.__version__, mbsd_examples.__version__)"
